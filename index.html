<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Training</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f5ef;
      color: #46504b;
    }

    header {
      padding: 28px 20px 20px;
      background: #fffdf8;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      color: #4f6259;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      font-size: 20px;
      color: #53665d;
      margin-top: 10px;
    }

    h3 {
      margin-top: 30px;
      color: #697871;
    }

    /* 日付移動 */

    .date-navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      background: #fffdf8;
      border-radius: 18px;
      padding: 12px;
    }

    .date-navigation button {
      margin: 0;
      width: 45px;
      height: 42px;
      padding: 0;
      font-size: 24px;
      background: #e8eee9;
      color: #60766b;
    }

    .date-display {
      text-align: center;
      flex: 1;
      font-size: 17px;
      color: #5e6d66;
    }

    .today-label {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: #91a097;
    }

    /* 過去7日間 */

    .week-title {
      margin-top: 28px;
      margin-bottom: 12px;
      font-size: 15px;
      color: #87918c;
    }

    .week {
      display: flex;
      justify-content: space-between;
      background: #fffdf8;
      padding: 15px 12px;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    .day {
      text-align: center;
      font-size: 11px;
      color: #8b948f;
      width: 13%;
    }

    .circle {
      width: 28px;
      height: 28px;
      margin: 5px auto 4px;
      border-radius: 50%;
      background: #e6e9e4;
    }

    .circle.done {
      background: #a9c4b5;
    }

    .circle.today {
      outline: 2px solid #7f9e8f;
      outline-offset: 2px;
    }

    /* メニュー */

    .menu-card {
      background: #fffdf8;
      border-radius: 17px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(70,80,75,0.06);
    }

    .menu-name {
      font-size: 18px;
      font-weight: bold;
      color: #52645c;
    }

    .menu-detail {
      margin-top: 6px;
      color: #89938e;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 10px 14px;
      margin-top: 12px;
      background: #78988a;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .add-button,
    .save-button,
    .new-menu-button {
      width: 100%;
      border-radius: 16px;
      padding: 17px;
      margin-top: 10px;
      font-size: 16px;
    }

    .add-button {
      background: #78988a;
    }

    .save-button {
      background: #91aa9d;
    }

    .new-menu-button {
      background: #b5aaa0;
    }

    .empty {
      text-align: center;
      padding: 38px 20px;
      color: #9aa29e;
      background: #fffdf8;
      border-radius: 17px;
    }

    #menuList,
    #newMenuForm {
      display: none;
      margin-top: 30px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #dfe3de;
      border-radius: 11px;
      font-size: 16px;
      background: #fffdf8;
      color: #46504b;
    }

    label {
      font-size: 14px;
      color: #7d8882;
    }

    .saved-message {
      text-align: center;
      color: #78988a;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>My Training</h1>
</header>

<main>

  <!-- 日付 -->

  <div class="date-navigation">

    <button onclick="changeDate(-1)">
      ←
    </button>

    <div class="date-display">
      <span id="dateDisplay"></span>
      <span class="today-label" id="todayLabel"></span>
    </div>

    <button id="nextButton" onclick="changeDate(1)">
      →
    </button>

  </div>


  <!-- 今日やること -->

  <h2 id="trainingTitle">
    今日やること
  </h2>

  <div id="todayMenu">
  </div>


  <button class="save-button" onclick="saveTraining()">
    この日のトレーニングを保存
  </button>


  <!-- 過去7日間 -->

  <div class="week-title">
    過去7日間
  </div>

  <div class="week" id="week"></div>


  <!-- メニュー追加 -->

  <button class="add-button" onclick="showMenu()">
    ＋ メニューを追加
  </button>


  <!-- メニュー表 -->

  <div id="menuList">

    <h2>メニュー表</h2>

    <h3>筋トレ</h3>

    <div id="strengthMenus"></div>

    <h3>ストレッチ</h3>

    <div id="stretchMenus"></div>

    <button class="new-menu-button" onclick="showNewMenuForm()">
      ＋ 新しいメニューを作る
    </button>

  </div>


  <!-- 新しいメニュー -->

  <div id="newMenuForm">

    <h2>新しいメニュー</h2>

    <label>メニュー名</label>

    <input
      type="text"
      id="newMenuName"
      placeholder="例：腹筋"
    >

    <label>回数・時間</label>

    <input
      type="text"
      id="newMenuDetail"
      placeholder="例：10回、3分など"
    >

    <label>種類</label>

    <select id="newMenuType">
      <option value="筋トレ">筋トレ</option>
      <option value="ストレッチ">ストレッチ</option>
    </select>

    <button onclick="createMenu()">
      メニュー表に追加
    </button>

  </div>

</main>


<script>

const defaultMenus = [

  {
    name: "腕立て",
    detail: "5回",
    type: "筋トレ"
  },

  {
    name: "ラットプル",
    detail: "30回",
    type: "筋トレ"
  },

  {
    name: "スクワット",
    detail: "10回",
    type: "筋トレ"
  },

  {
    name: "首・肩ストレッチ",
    detail: "3分",
    type: "ストレッチ"
  },

  {
    name: "股関節ストレッチ",
    detail: "3分",
    type: "ストレッチ"
  }

];


/* 今日の日付 */

function getToday() {

  const date = new Date();

  date.setHours(0, 0, 0, 0);

  return date;

}


/* 現在表示している日 */

let currentDate = getToday();


/* 日付をYYYY-MM-DDにする */

function getDateKey(date) {

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  return year + "-" + month + "-" + day;

}


/* 日本語の日付 */

function getDateText(date) {

  return (
    date.getFullYear() +
    "年" +
    (date.getMonth() + 1) +
    "月" +
    date.getDate() +
    "日"
  );

}


/* 今日かどうか */

function isToday(date) {

  return (
    getDateKey(date) ===
    getDateKey(getToday())
  );

}


/* 保存データ */

function getHistory() {

  return JSON.parse(
    localStorage.getItem("trainingHistory")
  ) || [];

}


/* カスタムメニュー */

function getCustomMenus() {

  return JSON.parse(
    localStorage.getItem("customMenus")
  ) || [];

}


/* 日付を表示 */

function displayDate() {

  document.getElementById("dateDisplay").textContent =
    getDateText(currentDate);


  document.getElementById("todayLabel").textContent =
    isToday(currentDate)
      ? "今日"
      : "";


  document.getElementById("trainingTitle").textContent =
    isToday(currentDate)
      ? "今日やること"
      : getDateText(currentDate) + "のトレーニング";


  /* 今日より未来には進めない */

  document.getElementById("nextButton").disabled =
    isToday(currentDate);

  document.getElementById("nextButton").style.opacity =
    isToday(currentDate)
      ? "0.35"
      : "1";


  displaySavedTraining();

}


/* 前の日・次の日 */

function changeDate(amount) {

  currentDate.setDate(
    currentDate.getDate() + amount
  );

  displayDate();

}


/* その日の保存済みトレーニングを表示 */

function displaySavedTraining() {

  const todayMenu =
    document.getElementById("todayMenu");


  const history =
    getHistory();


  const dateKey =
    getDateKey(currentDate);


  const records =
    history.filter(function(record) {

      return record.dateKey === dateKey;

    });


  if (records.length === 0) {

    todayMenu.innerHTML = `

      <div class="empty">
        まだメニューがありません
      </div>

    `;

    return;

  }


  todayMenu.innerHTML = "";


  records.forEach(function(record) {

    const card =
      document.createElement("div");

    card.className = "menu-card";


    card.innerHTML = `

      <div class="menu-name">
        ${record.name}
      </div>

      <div class="menu-detail">
        ${record.detail}
      </div>

      <div class="saved-message">
        保存済み
      </div>

    `;


    todayMenu.appendChild(card);

  });

}


/* メニュー表を開く */

function showMenu() {

  document.getElementById("menuList").style.display =
    "block";

  document.getElementById("newMenuForm").style.display =
    "none";

  displayMenus();

}


/* メニュー表 */

function displayMenus() {

  const strength =
    document.getElementById("strengthMenus");

  const stretch =
    document.getElementById("stretchMenus");


  strength.innerHTML = "";

  stretch.innerHTML = "";


  const customMenus =
    getCustomMenus();


  const menus =
    defaultMenus.concat(customMenus);


  menus.forEach(function(menu, index) {

    const card =
      document.createElement("div");

    card.className = "menu-card";


    card.innerHTML = `

      <div class="menu-name">
        ${menu.name}
      </div>

      <div class="menu-detail">
        ${menu.detail}
      </div>

      <button class="use-button">
        この日に追加
      </button>

    `;


    card.querySelector(".use-button").onclick =
      function() {

        addMenu(
          menu.name,
          menu.detail
        );

      };


    /* 自分で追加したメニューだけ編集・削除 */

    if (index >= defaultMenus.length) {

      const customIndex =
        index - defaultMenus.length;


      const editButton =
        document.createElement("button");

      editButton.textContent = "編集";


      editButton.onclick =
        function() {

          editMenu(customIndex);

        };


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent = "削除";

      deleteButton.style.background =
        "#b9aaa2";


      deleteButton.onclick =
        function() {

          deleteMenu(customIndex);

        };


      card.appendChild(editButton);

      card.appendChild(deleteButton);

    }


    if (menu.type === "筋トレ") {

      strength.appendChild(card);

    } else {

      stretch.appendChild(card);

    }

  });

}


/* メニューをその日に追加 */

function addMenu(name, detail) {

  const history =
    getHistory();


  const dateKey =
    getDateKey(currentDate);


  /* 同じ日の既存記録を削除 */

  const newHistory =
    history.filter(function(record) {

      return record.dateKey !== dateKey;

    });


  newHistory.push({

    date:
      getDateText(currentDate),

    dateKey:
      dateKey,

    name:
      name,

    detail:
      detail

  });


  localStorage.setItem(

    "trainingHistory",

    JSON.stringify(newHistory)

  );


  document.getElementById("menuList").style.display =
    "none";


  displaySavedTraining();

  displayWeek();

}


/* 保存 */

function saveTraining() {

  const history =
    getHistory();


  const dateKey =
    getDateKey(currentDate);


  const existing =
    history.some(function(record) {

      return record.dateKey === dateKey;

    });


  if (!existing) {

    alert("まずメニューを追加してください");

    return;

  }


  alert("保存されています");

}


/* 新しいメニュー */

function showNewMenuForm() {

  document.getElementById("newMenuForm").style.display =
    "block";

}


/* 新しいメニューを作成 */

function createMenu() {

  const name =
    document.getElementById("newMenuName")
      .value.trim();


  const detail =
    document.getElementById("newMenuDetail")
      .value.trim();


  const type =
    document.getElementById("newMenuType")
      .value;


  if (!name || !detail) {

    alert(
      "メニュー名と回数・時間を入力してください"
    );

    return;

  }


  const customMenus =
    getCustomMenus();


  customMenus.push({

    name: name,

    detail: detail,

    type: type

  });


  localStorage.setItem(

    "customMenus",

    JSON.stringify(customMenus)

  );


  alert("メニュー表に追加しました");


  document.getElementById("newMenuName").value = "";

  document.getElementById("newMenuDetail").value = "";


  document.getElementById("newMenuForm").style.display =
    "none";


  displayMenus();

}


/* メニュー編集 */

function editMenu(index) {

  const customMenus =
    getCustomMenus();


  const menu =
    customMenus[index];


  const newName =
    prompt(
      "メニュー名",
      menu.name
    );


  if (newName === null) {
    return;
  }


  const newDetail =
    prompt(
      "回数・時間",
      menu.detail
    );


  if (newDetail === null) {
    return;
  }


  const newType =
    prompt(
      "種類を入力してください（筋トレ / ストレッチ）",
      menu.type
    );


  if (
    newType !== "筋トレ" &&
    newType !== "ストレッチ"
  ) {

    alert(
      "「筋トレ」または「ストレッチ」と入力してください"
    );

    return;

  }


  customMenus[index] = {

    name: newName,

    detail: newDetail,

    type: newType

  };


  localStorage.setItem(

    "customMenus",

    JSON.stringify(customMenus)

  );


  displayMenus();

  alert("編集しました");

}


/* メニュー削除 */

function deleteMenu(index) {

  const customMenus =
    getCustomMenus();


  const menu =
    customMenus[index];


  const answer =
    confirm(
      "「" + menu.name + "」を削除しますか？"
    );


  if (!answer) {
    return;
  }


  customMenus.splice(index, 1);


  localStorage.setItem(

    "customMenus",

    JSON.stringify(customMenus)

  );


  displayMenus();

  alert("削除しました");

}


/* 過去7日間 */

function displayWeek() {

  const week =
    document.getElementById("week");


  week.innerHTML = "";


  const history =
    getHistory();


  for (let i = 6; i >= 0; i--) {

    const date =
      getToday();


    date.setDate(
      date.getDate() - i
    );


    const dateKey =
      getDateKey(date);


    const hasTraining =
      history.some(function(record) {

        return record.dateKey === dateKey;

      });


    const dayNames =
      [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
      ];


    const dayBox =
      document.createElement("div");

    dayBox.className = "day";


    dayBox.innerHTML =
      dayNames[date.getDay()];


    const circle =
      document.createElement("div");

    circle.className = "circle";


    if (hasTraining) {

      circle.classList.add("done");

    }


    if (isToday(date)) {

      circle.classList.add("today");

    }


    dayBox.appendChild(circle);


    week.appendChild(dayBox);

  }

}


/* 最初に表示 */

displayDate();

displayWeek();

</script>

</body>
</html>
