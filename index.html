<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Training</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f7f5;
      color: #333;
    }

    header {
      padding: 30px 20px 20px;
      background: white;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .date {
      margin-top: 8px;
      color: #777;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      font-size: 20px;
      margin-top: 10px;
    }

    h3 {
      margin-top: 30px;
    }

    .menu-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .menu-name {
      font-size: 18px;
      font-weight: bold;
    }

    .menu-detail {
      margin-top: 6px;
      color: #777;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 12px;
      background: #333;
      color: white;
      font-size: 14px;
    }

    .add-button {
      width: 100%;
      border-radius: 16px;
      padding: 18px;
      margin-top: 10px;
      font-size: 17px;
    }

    .save-button {
      width: 100%;
      border-radius: 16px;
      padding: 18px;
      margin-top: 10px;
      font-size: 17px;
      background: #555;
    }

    .history-button {
      width: 100%;
      border-radius: 16px;
      padding: 18px;
      margin-top: 10px;
      font-size: 17px;
      background: #777;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #888;
      background: white;
      border-radius: 16px;
    }

    #menuList {
      display: none;
      margin-top: 30px;
    }

    #history {
      display: none;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>My Training</h1>
  <div class="date" id="todayDate"></div>
</header>

<main>

  <h2>今日やること</h2>

  <div id="todayMenu">
    <div class="empty">
      まだメニューがありません
    </div>
  </div>

  <button class="add-button" onclick="showMenu()">
    ＋ メニューを追加
  </button>

  <button class="save-button" onclick="saveTraining()">
    今日のトレーニングを保存
  </button>

  <button class="history-button" onclick="showHistory()">
    記録を見る
  </button>


  <div id="menuList">

    <h2>メニュー表</h2>

    <h3>筋トレ</h3>

    <div class="menu-card">
      <div class="menu-name">腕立て</div>
      <div class="menu-detail">5回</div>
      <button onclick="addMenu('腕立て', '5回')">
        今日に追加
      </button>
    </div>

    <div class="menu-card">
      <div class="menu-name">ラットプル</div>
      <div class="menu-detail">30回</div>
      <button onclick="addMenu('ラットプル', '30回')">
        今日に追加
      </button>
    </div>

    <div class="menu-card">
      <div class="menu-name">スクワット</div>
      <div class="menu-detail">10回</div>
      <button onclick="addMenu('スクワット', '10回')">
        今日に追加
      </button>
    </div>

    <h3>ストレッチ</h3>

    <div class="menu-card">
      <div class="menu-name">首・肩ストレッチ</div>
      <div class="menu-detail">3分</div>
      <button onclick="addMenu('首・肩ストレッチ', '3分')">
        今日に追加
      </button>
    </div>

    <div class="menu-card">
      <div class="menu-name">股関節ストレッチ</div>
      <div class="menu-detail">3分</div>
      <button onclick="addMenu('股関節ストレッチ', '3分')">
        今日に追加
      </button>
    </div>

  </div>


  <div id="history">

    <h2>これまでの記録</h2>

    <div id="historyList"></div>

  </div>

</main>


<script>

const todayDate = document.getElementById("todayDate");

const today = new Date();

const dateText =
  today.getFullYear() + "年" +
  (today.getMonth() + 1) + "月" +
  today.getDate() + "日";

todayDate.textContent = dateText;


let selectedMenu = null;


function showMenu() {
  document.getElementById("menuList").style.display = "block";
}


function addMenu(name, detail) {

  selectedMenu = {
    name: name,
    detail: detail
  };

  const todayMenu = document.getElementById("todayMenu");

  todayMenu.innerHTML = `
    <div class="menu-card">
      <div class="menu-name">${name}</div>
      <div class="menu-detail">${detail}</div>
    </div>
  `;

  document.getElementById("menuList").style.display = "none";
}


function saveTraining() {

  if (!selectedMenu) {
    alert("まずメニューを選んでください");
    return;
  }

  const history =
    JSON.parse(localStorage.getItem("trainingHistory")) || [];

  const record = {
    date: dateText,
    name: selectedMenu.name,
    detail: selectedMenu.detail
  };

  history.push(record);

  localStorage.setItem(
    "trainingHistory",
    JSON.stringify(history)
  );

  alert("保存しました");

  selectedMenu = null;

  document.getElementById("todayMenu").innerHTML = `
    <div class="empty">
      保存しました
    </div>
  `;
}


function showHistory() {

  const history =
    JSON.parse(localStorage.getItem("trainingHistory")) || [];

  const historyList =
    document.getElementById("historyList");

  document.getElementById("history").style.display = "block";

  if (history.length === 0) {

    historyList.innerHTML = `
      <div class="empty">
        まだ記録がありません
      </div>
    `;

    return;
  }

  historyList.innerHTML = "";

  history.slice().reverse().forEach(function(record) {

    const item = document.createElement("div");

    item.className = "menu-card";

    item.innerHTML = `
      <div class="menu-name">${record.name}</div>
      <div class="menu-detail">
        ${record.detail}　・　${record.date}
      </div>
    `;

    historyList.appendChild(item);

  });
}

</script>

</body>
</html>
