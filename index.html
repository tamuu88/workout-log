<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のワークアウト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f5ef;
      color: #46504b;
    }

    header {
      padding: 24px 20px 18px;
      background: #fffdf8;
    }

    .header-inner {
      max-width: 600px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: #4f6259;
    }

    /* リセットは控えめ */

    .reset-button {
      margin: 0;
      padding: 5px 8px;
      border: none;
      background: transparent;
      color: #b0b5b1;
      font-size: 11px;
      cursor: pointer;
    }

    .reset-button:hover {
      color: #7f8984;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      font-size: 20px;
      color: #53665d;
      margin: 8px 0 14px;
    }

    h3 {
      margin: 28px 0 12px;
      font-size: 16px;
      color: #697871;
    }

    /* 日付 */

    .date-navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fffdf8;
      border-radius: 18px;
      padding: 10px 12px;
      margin-bottom: 25px;
    }

    .date-navigation button {
      margin: 0;
      width: 42px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 10px;
      background: #e8eee9;
      color: #60766b;
      font-size: 22px;
      cursor: pointer;
    }

    .date-display {
      text-align: center;
      flex: 1;
      font-size: 17px;
      color: #5e6d66;
    }

    .today-label {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: #91a097;
    }

    /* 今日できたこと */

    .today-card {
      background: #fffdf8;
      border-radius: 17px;
      padding: 18px;
      margin-bottom: 22px;
      box-shadow: 0 2px 8px rgba(70, 80, 75, 0.05);
    }

    .today-name {
      font-size: 19px;
      font-weight: bold;
      color: #52645c;
    }

    .today-detail {
      margin-top: 7px;
      color: #89938e;
    }

    .empty {
      text-align: center;
      padding: 30px 20px;
      color: #9aa29e;
      background: #fffdf8;
      border-radius: 17px;
    }

    /* 過去7日間 */

    .week-title {
      margin: 28px 0 10px;
      font-size: 14px;
      color: #87918c;
    }

    .week {
      display: flex;
      justify-content: space-between;
      background: #fffdf8;
      padding: 14px 10px;
      border-radius: 18px;
      margin-bottom: 28px;
    }

    .day {
      text-align: center;
      font-size: 10px;
      color: #8b948f;
      width: 13%;
    }

    .circle {
      width: 27px;
      height: 27px;
      margin: 5px auto 3px;
      border-radius: 50%;
      background: #e6e9e4;
    }

    .circle.done {
      background: #a9c4b5;
    }

    .circle.today {
      outline: 2px solid #7f9e8f;
      outline-offset: 2px;
    }

    /* メニュー追加ボタン */

    .add-button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px;
      background: #78988a;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    /* メニュー表 */
  
    #menuList {
    margin-top: 28px;
    }
    
    #newMenuForm {
      display: none;
      margin-top: 28px;
    }

    /* 3列カード */

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .menu-card {
      position: relative;
      background: #fffdf8;
      border-radius: 14px;
      padding: 13px 8px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      box-shadow: 0 2px 7px rgba(70, 80, 75, 0.05);
    }

    .menu-name {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.4;
      color: #52645c;
      word-break: break-word;
    }

    .menu-detail {
      margin-top: 5px;
      font-size: 12px;
      color: #89938e;
    }

    .use-button {
      width: 100%;
      margin-top: 9px;
      padding: 7px 4px;
      border: none;
      border-radius: 8px;
      background: #e4eee8;
      color: #60766b;
      font-size: 11px;
      cursor: pointer;
    }

    .edit-delete {
      display: flex;
      gap: 4px;
      width: 100%;
      margin-top: 5px;
    }

    .edit-button,
    .delete-button {
      flex: 1;
      margin: 0;
      padding: 5px 2px;
      border: none;
      border-radius: 7px;
      font-size: 9px;
      cursor: pointer;
    }

    .edit-button {
      background: #edf0ed;
      color: #718079;
    }

    .delete-button {
      background: #f0eae6;
      color: #9b8980;
    }

    .new-menu-button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 13px;
      background: #b5aaa0;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    /* 新しいメニュー */

    label {
      font-size: 13px;
      color: #7d8882;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      margin-bottom: 14px;
      border: 1px solid #dfe3de;
      border-radius: 10px;
      font-size: 15px;
      background: #fffdf8;
      color: #46504b;
    }

    .create-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #78988a;
      color: white;
      font-size: 14px;
    }

    @media (max-width: 400px) {
      .menu-grid {
        gap: 7px;
      }

      .menu-card {
        padding: 11px 6px;
      }

      .menu-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>今日のワークアウト</h1>

    <button class="reset-button" onclick="resetTraining()">
      リセット
    </button>
  </div>
</header>


<main>

  <!-- 日付 -->

  <div class="date-navigation">

    <button onclick="changeDate(-1)">←</button>

    <div class="date-display">
      <span id="dateDisplay"></span>
      <span class="today-label" id="todayLabel"></span>
    </div>

    <button id="nextButton" onclick="changeDate(1)">→</button>

  </div>


  <!-- 今日できたこと -->

  <h2 id="trainingTitle">
    今日できたこと
  </h2>

  <div id="todayMenu"></div>


  <!-- 過去7日間 -->

  <div class="week-title">
    過去7日間
  </div>

  <div class="week" id="week"></div>

  <!-- メニュー表 -->

  <div id="menuList">

    <h2>メニュー表</h2>

    <h3>筋トレ</h3>

    <div id="strengthMenus" class="menu-grid"></div>

    <h3>ストレッチ</h3>

    <div id="stretchMenus" class="menu-grid"></div>

    <button class="new-menu-button" onclick="showNewMenuForm()">
      ＋ 新しいメニューを作る
    </button>

  </div>


  <!-- 新しいメニュー -->

  <div id="newMenuForm">

    <h2>新しいメニュー</h2>

    <label>メニュー名</label>

    <input
      type="text"
      id="newMenuName"
      placeholder="例：腹筋"
    >

    <label>回数・時間</label>

    <input
      type="text"
      id="newMenuDetail"
      placeholder="例：10回、3分など"
    >

    <label>種類</label>

    <select id="newMenuType">
      <option value="筋トレ">筋トレ</option>
      <option value="ストレッチ">ストレッチ</option>
    </select>

    <button class="create-button" onclick="createMenu()">
      メニュー表に追加
    </button>

  </div>

</main>


<script>

const defaultMenus = [

  {
    name: "腕立て",
    detail: "5回",
    type: "筋トレ"
  },

  {
    name: "ラットプル",
    detail: "30回",
    type: "筋トレ"
  },

  {
    name: "スクワット",
    detail: "10回",
    type: "筋トレ"
  },

  {
    name: "首・肩ストレッチ",
    detail: "3分",
    type: "ストレッチ"
  },

  {
    name: "股関節ストレッチ",
    detail: "3分",
    type: "ストレッチ"
  }

];


function getToday() {

  const date = new Date();

  date.setHours(0, 0, 0, 0);

  return date;

}


let currentDate = getToday();


function getDateKey(date) {

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1).padStart(2, "0");

  const day =
    String(date.getDate()).padStart(2, "0");

  return year + "-" + month + "-" + day;

}


function getDateText(date) {

  return (
    date.getFullYear() +
    "年" +
    (date.getMonth() + 1) +
    "月" +
    date.getDate() +
    "日"
  );

}


function isToday(date) {

  return (
    getDateKey(date) ===
    getDateKey(getToday())
  );

}


function getHistory() {

  return JSON.parse(
    localStorage.getItem("trainingHistory")
  ) || [];

}


function getCustomMenus() {

  return JSON.parse(
    localStorage.getItem("customMenus")
  ) || [];

}


/* 日付表示 */

function displayDate() {

  document.getElementById("dateDisplay").textContent =
    getDateText(currentDate);


  document.getElementById("todayLabel").textContent =
    isToday(currentDate) ? "今日" : "";


  document.getElementById("trainingTitle").textContent =
    isToday(currentDate)
      ? "今日できたこと"
      : getDateText(currentDate) + "のトレーニング";


  const nextButton =
    document.getElementById("nextButton");


  nextButton.disabled =
    isToday(currentDate);


  nextButton.style.opacity =
    isToday(currentDate) ? "0.35" : "1";


  displaySavedTraining();

}


/* 日付移動 */

function changeDate(amount) {

  currentDate.setDate(
    currentDate.getDate() + amount
  );

  displayDate();

}


/* その日の記録を表示 */

function displaySavedTraining() {

  const container =
    document.getElementById("todayMenu");


  const history =
    getHistory();


  const dateKey =
    getDateKey(currentDate);


  const records =
    history.filter(function(record) {

      return record.dateKey === dateKey;

    });


  if (records.length === 0) {

    container.innerHTML = `

      <div class="empty">
        まだメニューがありません
      </div>

    `;

    return;

  }


  container.innerHTML = "";


  records.forEach(function(record) {

    const card =
      document.createElement("div");

    card.className = "today-card";


    card.innerHTML = `

      <div class="today-name">
        ${record.name}
      </div>

      <div class="today-detail">
        ${record.detail}
      </div>

    `;


    container.appendChild(card);

  });

}


/* メニュー表 */

function displayMenus() {

  const strength =
    document.getElementById("strengthMenus");

  const stretch =
    document.getElementById("stretchMenus");


  strength.innerHTML = "";

  stretch.innerHTML = "";


  const customMenus =
    getCustomMenus();


  const menus =
    defaultMenus.concat(customMenus);


  menus.forEach(function(menu, index) {

    const card =
      document.createElement("div");

    card.className = "menu-card";


    const name =
      document.createElement("div");

    name.className = "menu-name";

    name.textContent =
      menu.name;


    const detail =
      document.createElement("div");

    detail.className = "menu-detail";

    detail.textContent =
      menu.detail;


    const useButton =
      document.createElement("button");

    useButton.className = "use-button";

    useButton.textContent =
      "追加";


    useButton.onclick =
      function() {

        addMenu(
          menu.name,
          menu.detail
        );

      };


    card.appendChild(name);

    card.appendChild(detail);

    card.appendChild(useButton);


    /* 自分で追加したメニュー */

    if (index >= defaultMenus.length) {

      const customIndex =
        index - defaultMenus.length;


      const editDelete =
        document.createElement("div");

      editDelete.className =
        "edit-delete";


      const editButton =
        document.createElement("button");

      editButton.className =
        "edit-button";

      editButton.textContent =
        "編集";


      editButton.onclick =
        function() {

          editMenu(customIndex);

        };


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-button";

      deleteButton.textContent =
        "削除";


      deleteButton.onclick =
        function() {

          deleteMenu(customIndex);

        };


      editDelete.appendChild(editButton);

      editDelete.appendChild(deleteButton);

      card.appendChild(editDelete);

    }


    if (menu.type === "筋トレ") {

      strength.appendChild(card);

    } else {

      stretch.appendChild(card);

    }

  });

}


/* メニューを選択 */

function addMenu(name, detail) {

  const history =
    getHistory();


  const dateKey =
    getDateKey(currentDate);


  /*
    その日にすでに記録がある場合は、
    いったん削除して新しいメニューに置き換える
  */

  const newHistory =
    history.filter(function(record) {

      return record.dateKey !== dateKey;

    });


  newHistory.push({

    date:
      getDateText(currentDate),

    dateKey:
      dateKey,

    name:
      name,

    detail:
      detail

  });


  localStorage.setItem(
    "trainingHistory",
    JSON.stringify(newHistory)
  );


  displaySavedTraining();

  displayWeek();

}


/* その日の記録をリセット */

function resetTraining() {

  const dateKey =
    getDateKey(currentDate);


  const history =
    getHistory();


  const hasRecord =
    history.some(function(record) {

      return record.dateKey === dateKey;

    });


  if (!hasRecord) {

    return;

  }


  const answer =
    confirm(
      getDateText(currentDate) +
      "のトレーニングをリセットしますか？"
    );


  if (!answer) {

    return;

  }


  const newHistory =
    history.filter(function(record) {

      return record.dateKey !== dateKey;

    });


  localStorage.setItem(
    "trainingHistory",
    JSON.stringify(newHistory)
  );


  displaySavedTraining();

  displayWeek();

}


/* 新しいメニューを表示 */

function showNewMenuForm() {

  document.getElementById("newMenuForm").style.display =
    "block";

}


/* 新しいメニューを作成 */

function createMenu() {

  const name =
    document.getElementById("newMenuName")
      .value.trim();


  const detail =
    document.getElementById("newMenuDetail")
      .value.trim();


  const type =
    document.getElementById("newMenuType")
      .value;


  if (!name || !detail) {

    alert(
      "メニュー名と回数・時間を入力してください"
    );

    return;

  }


  const customMenus =
    getCustomMenus();


  customMenus.push({

    name: name,

    detail: detail,

    type: type

  });


  localStorage.setItem(
    "customMenus",
    JSON.stringify(customMenus)
  );


  document.getElementById("newMenuName").value = "";

  document.getElementById("newMenuDetail").value = "";


  document.getElementById("newMenuForm").style.display =
    "none";


  displayMenus();


  alert("メニュー表に追加しました");

}


/* メニュー編集 */

function editMenu(index) {

  const customMenus =
    getCustomMenus();


  const menu =
    customMenus[index];


  const newName =
    prompt(
      "メニュー名",
      menu.name
    );


  if (newName === null) {
    return;
  }


  const newDetail =
    prompt(
      "回数・時間",
      menu.detail
    );


  if (newDetail === null) {
    return;
  }


  const newType =
    prompt(
      "種類を入力してください（筋トレ / ストレッチ）",
      menu.type
    );


  if (
    newType !== "筋トレ" &&
    newType !== "ストレッチ"
  ) {

    alert(
      "「筋トレ」または「ストレッチ」と入力してください"
    );

    return;

  }


  customMenus[index] = {

    name: newName,

    detail: newDetail,

    type: newType

  };


  localStorage.setItem(
    "customMenus",
    JSON.stringify(customMenus)
  );


  displayMenus();

}


/* メニュー削除 */

function deleteMenu(index) {

  const customMenus =
    getCustomMenus();


  const menu =
    customMenus[index];


  const answer =
    confirm(
      "「" + menu.name + "」を削除しますか？"
    );


  if (!answer) {
    return;
  }


  customMenus.splice(index, 1);


  localStorage.setItem(
    "customMenus",
    JSON.stringify(customMenus)
  );


  displayMenus();

}


/* 過去7日間 */

function displayWeek() {

  const week =
    document.getElementById("week");


  week.innerHTML = "";


  const history =
    getHistory();


  for (let i = 6; i >= 0; i--) {

    const date =
      getToday();


    date.setDate(
      date.getDate() - i
    );


    const dateKey =
      getDateKey(date);


    const hasTraining =
      history.some(function(record) {

        return record.dateKey === dateKey;

      });


    const dayNames =
      ["日", "月", "火", "水", "木", "金", "土"];


    const dayBox =
      document.createElement("div");

    dayBox.className =
      "day";


    dayBox.textContent =
      dayNames[date.getDay()];


    const circle =
      document.createElement("div");

    circle.className =
      "circle";


    if (hasTraining) {

      circle.classList.add("done");

    }


    if (isToday(date)) {

      circle.classList.add("today");

    }


    dayBox.appendChild(circle);

    week.appendChild(dayBox);

  }

}


/* 起動 */

displayDate();
displayWeek();
displayMenus();

</script>

</body>
</html>
