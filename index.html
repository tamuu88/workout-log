<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Training</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f5ef;
      color: #46504b;
    }

    header {
      padding: 30px 20px 22px;
      background: #fffdf8;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      color: #4f6259;
    }

    .date {
      margin-top: 8px;
      color: #89938e;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      font-size: 20px;
      color: #53665d;
      margin-top: 10px;
    }

    h3 {
      margin-top: 30px;
      color: #697871;
    }

    /* 過去7日間 */

    .week-title {
      margin-top: 4px;
      margin-bottom: 12px;
      font-size: 15px;
      color: #87918c;
    }

    .week {
      display: flex;
      justify-content: space-between;
      background: #fffdf8;
      padding: 15px 12px;
      border-radius: 18px;
      margin-bottom: 28px;
    }

    .day {
      text-align: center;
      font-size: 11px;
      color: #8b948f;
      width: 13%;
    }

    .circle {
      width: 28px;
      height: 28px;
      margin: 5px auto 4px;
      border-radius: 50%;
      background: #e6e9e4;
    }

    .circle.done {
      background: #a9c4b5;
    }

    .circle.today {
      outline: 2px solid #7f9e8f;
      outline-offset: 2px;
    }

    .menu-card {
      background: #fffdf8;
      border-radius: 17px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(70,80,75,0.06);
    }

    .menu-name {
      font-size: 18px;
      font-weight: bold;
      color: #52645c;
    }

    .menu-detail {
      margin-top: 6px;
      color: #89938e;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 10px 14px;
      margin-top: 12px;
      background: #78988a;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .add-button,
    .save-button,
    .history-button,
    .new-menu-button {
      width: 100%;
      border-radius: 16px;
      padding: 17px;
      margin-top: 10px;
      font-size: 16px;
    }

    .add-button {
      background: #78988a;
    }

    .save-button {
      background: #91aa9d;
    }

    .history-button {
      background: #a8b4ae;
    }

    .new-menu-button {
      background: #b5aaa0;
    }

    .empty {
      text-align: center;
      padding: 38px 20px;
      color: #9aa29e;
      background: #fffdf8;
      border-radius: 17px;
    }

    #menuList,
    #newMenuForm,
    #history {
      display: none;
      margin-top: 30px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #dfe3de;
      border-radius: 11px;
      font-size: 16px;
      background: #fffdf8;
      color: #46504b;
    }

    label {
      font-size: 14px;
      color: #7d8882;
    }
  </style>
</head>

<body>

<header>
  <h1>My Training</h1>
  <div class="date" id="todayDate"></div>
</header>

<main>

  <button class="add-button" onclick="showMenu()">
    ＋ メニューを追加
  </button>


  <h2>今日やること</h2>

  <div id="todayMenu">
    <div class="empty">
      まだメニューがありません
    </div>
  </div>


  <button class="save-button" onclick="saveTraining()">
    今日のトレーニングを保存
  </button>


  <div class="week-title">過去7日間</div>

  <div class="week" id="week"></div>


  <button class="history-button" onclick="showHistory()">
    記録を見る
  </button>


  <div id="menuList">

    <h2>メニュー表</h2>

    <h3>筋トレ</h3>

    <div id="strengthMenus"></div>

    <h3>ストレッチ</h3>

    <div id="stretchMenus"></div>

    <button class="new-menu-button" onclick="showNewMenuForm()">
      ＋ 新しいメニューを作る
    </button>

  </div>


  <div id="newMenuForm">

    <h2>新しいメニュー</h2>

    <label>メニュー名</label>

    <input
      type="text"
      id="newMenuName"
      placeholder="例：腹筋"
    >

    <label>回数・時間</label>

    <input
      type="text"
      id="newMenuDetail"
      placeholder="例：10回、3分など"
    >

    <label>種類</label>

    <select id="newMenuType">
      <option value="筋トレ">筋トレ</option>
      <option value="ストレッチ">ストレッチ</option>
    </select>

    <button onclick="createMenu()">
      メニュー表に追加
    </button>

  </div>


  <div id="history">

    <h2>これまでの記録</h2>

    <div id="historyList"></div>

  </div>

</main>


<script>

const today = new Date();

const dateText =
  today.getFullYear() + "年" +
  (today.getMonth() + 1) + "月" +
  today.getDate() + "日";

document.getElementById("todayDate").textContent =
  dateText;


let selectedMenu = null;


const defaultMenus = [

  {
    name: "腕立て",
    detail: "5回",
    type: "筋トレ"
  },

  {
    name: "ラットプル",
    detail: "30回",
    type: "筋トレ"
  },

  {
    name: "スクワット",
    detail: "10回",
    type: "筋トレ"
  },

  {
    name: "首・肩ストレッチ",
    detail: "3分",
    type: "ストレッチ"
  },

  {
    name: "股関節ストレッチ",
    detail: "3分",
    type: "ストレッチ"
  }

];


function getCustomMenus() {

  return JSON.parse(
    localStorage.getItem("customMenus")
  ) || [];

}


function getHistory() {

  return JSON.parse(
    localStorage.getItem("trainingHistory")
  ) || [];

}


/* 過去7日間を表示 */

function displayWeek() {

  const week =
    document.getElementById("week");

  week.innerHTML = "";

  const history = getHistory();


  for (let i = 6; i >= 0; i--) {

    const date = new Date();

    date.setHours(0, 0, 0, 0);

    date.setDate(date.getDate() - i);


    const year =
      date.getFullYear();

    const month =
      String(date.getMonth() + 1)
      .padStart(2, "0");

    const day =
      String(date.getDate())
      .padStart(2, "0");


    const dateKey =
      year + "-" + month + "-" + day;


    const hasTraining =
      history.some(function(record) {

        return record.dateKey === dateKey;

      });


    const dayNames =
      ["日", "月", "火", "水", "木", "金", "土"];


    const dayBox =
      document.createElement("div");

    dayBox.className = "day";


    const circle =
      document.createElement("div");

    circle.className = "circle";


    if (hasTraining) {

      circle.classList.add("done");

    }


    if (i === 0) {

      circle.classList.add("today");

    }


    dayBox.innerHTML =
      dayNames[date.getDay()];


    dayBox.appendChild(circle);


    week.appendChild(dayBox);

  }

}


function showMenu() {

  document.getElementById("menuList").style.display =
    "block";

  document.getElementById("newMenuForm").style.display =
    "none";

  displayMenus();

}


function displayMenus() {

  const strength =
    document.getElementById("strengthMenus");

  const stretch =
    document.getElementById("stretchMenus");

  strength.innerHTML = "";

  stretch.innerHTML = "";


  const customMenus =
    getCustomMenus();


  const menus =
    defaultMenus.concat(customMenus);


  menus.forEach(function(menu, index) {

    const card =
      document.createElement("div");

    card.className = "menu-card";


    card.innerHTML = `

      <div class="menu-name">
        ${menu.name}
      </div>

      <div class="menu-detail">
        ${menu.detail}
      </div>

      <button class="use-button">
        今日に追加
      </button>

    `;


    card.querySelector(".use-button").onclick =
      function() {

        addMenu(
          menu.name,
          menu.detail
        );

      };


    if (index >= defaultMenus.length) {

      const customIndex =
        index - defaultMenus.length;


      const editButton =
        document.createElement("button");

      editButton.textContent = "編集";

      editButton.onclick =
        function() {

          editMenu(customIndex);

        };


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent = "削除";

      deleteButton.style.background =
        "#b9aaa2";


      deleteButton.onclick =
        function() {

          deleteMenu(customIndex);

        };


      card.appendChild(editButton);

      card.appendChild(deleteButton);

    }


    if (menu.type === "筋トレ") {

      strength.appendChild(card);

    } else {

      stretch.appendChild(card);

    }

  });

}


function addMenu(name, detail) {

  selectedMenu = {

    name: name,

    detail: detail

  };


  document.getElementById("todayMenu").innerHTML = `

    <div class="menu-card">

      <div class="menu-name">
        ${name}
      </div>

      <div class="menu-detail">
        ${detail}
      </div>

    </div>

  `;


  document.getElementById("menuList").style.display =
    "none";

}


function saveTraining() {

  if (!selectedMenu) {

    alert("まずメニューを選んでください");

    return;

  }


  const history =
    getHistory();


  const year =
    today.getFullYear();

  const month =
    String(today.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(today.getDate())
      .padStart(2, "0");


  const record = {

    date: dateText,

    dateKey:
      year + "-" + month + "-" + day,

    name:
      selectedMenu.name,

    detail:
      selectedMenu.detail

  };


  history.push(record);


  localStorage.setItem(

    "trainingHistory",

    JSON.stringify(history)

  );


  alert("保存しました");


  selectedMenu = null;


  document.getElementById("todayMenu").innerHTML = `

    <div class="empty">
      保存しました
    </div>

  `;


  displayWeek();

}


function showNewMenuForm() {

  document.getElementById("newMenuForm").style.display =
    "block";

}


function createMenu() {

  const name =
    document.getElementById("newMenuName")
      .value.trim();


  const detail =
    document.getElementById("newMenuDetail")
      .value.trim();


  const type =
    document.getElementById("newMenuType")
      .value;


  if (!name || !detail) {

    alert(
      "メニュー名と回数・時間を入力してください"
    );

    return;

  }


  const customMenus =
    getCustomMenus();


  customMenus.push({

    name: name,

    detail: detail,

    type: type

  });


  localStorage.setItem(

    "customMenus",

    JSON.stringify(customMenus)

  );


  alert("メニュー表に追加しました");


  document.getElementById("newMenuName").value = "";

  document.getElementById("newMenuDetail").value = "";


  document.getElementById("newMenuForm").style.display =
    "none";


  displayMenus();

}


function editMenu(index) {

  const customMenus =
    getCustomMenus();

  const menu =
    customMenus[index];


  const newName =
    prompt(
      "メニュー名",
      menu.name
    );


  if (newName === null) {
    return;
  }


  const newDetail =
    prompt(
      "回数・時間",
      menu.detail
    );


  if (newDetail === null) {
    return;
  }


  const newType =
    prompt(
      "種類を入力してください（筋トレ / ストレッチ）",
      menu.type
    );


  if (
    newType !== "筋トレ" &&
    newType !== "ストレッチ"
  ) {

    alert(
      "「筋トレ」または「ストレッチ」と入力してください"
    );

    return;

  }


  customMenus[index] = {

    name: newName,

    detail: newDetail,

    type: newType

  };


  localStorage.setItem(

    "customMenus",

    JSON.stringify(customMenus)

  );


  displayMenus();

  alert("編集しました");

}


function deleteMenu(index) {

  const customMenus =
    getCustomMenus();


  const menu =
    customMenus[index];


  const answer =
    confirm(
      "「" + menu.name + "」を削除しますか？"
    );


  if (!answer) {
    return;
  }


  customMenus.splice(index, 1);


  localStorage.setItem(

    "customMenus",

    JSON.stringify(customMenus)

  );


  displayMenus();

  alert("削除しました");

}


function showHistory() {

  const history =
    getHistory();


  const historyList =
    document.getElementById("historyList");


  document.getElementById("history").style.display =
    "block";


  if (history.length === 0) {

    historyList.innerHTML = `

      <div class="empty">
        まだ記録がありません
      </div>

    `;

    return;

  }


  historyList.innerHTML = "";


  history.slice().reverse().forEach(
    function(record) {

      const item =
        document.createElement("div");


      item.className = "menu-card";


      item.innerHTML = `

        <div class="menu-name">
          ${record.name}
        </div>

        <div class="menu-detail">
          ${record.detail} ・ ${record.date}
        </div>

      `;


      historyList.appendChild(item);

    }
  );

}


/* 起動時に過去7日間を表示 */

displayWeek();

</script>

</body>
</html>
