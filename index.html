<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Training</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f7f5;
      color: #333;
    }

    header {
      padding: 30px 20px 20px;
      background: white;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .date {
      margin-top: 8px;
      color: #777;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      font-size: 20px;
      margin-top: 10px;
    }

    h3 {
      margin-top: 30px;
    }

    .menu-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .menu-name {
      font-size: 18px;
      font-weight: bold;
    }

    .menu-detail {
      margin-top: 6px;
      color: #777;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 12px;
      background: #333;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .add-button,
    .save-button,
    .history-button,
    .new-menu-button {
      width: 100%;
      border-radius: 16px;
      padding: 18px;
      margin-top: 10px;
      font-size: 17px;
    }

    .save-button {
      background: #555;
    }

    .history-button {
      background: #777;
    }

    .new-menu-button {
      background: #999;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #888;
      background: white;
      border-radius: 16px;
    }

    #menuList,
    #newMenuForm,
    #history {
      display: none;
      margin-top: 30px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    label {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>My Training</h1>
  <div class="date" id="todayDate"></div>
</header>

<main>

  <h2>今日やること</h2>

  <div id="todayMenu">
    <div class="empty">
      まだメニューがありません
    </div>
  </div>

  <button class="add-button" onclick="showMenu()">
    ＋ メニューを追加
  </button>

  <button class="save-button" onclick="saveTraining()">
    今日のトレーニングを保存
  </button>

  <button class="history-button" onclick="showHistory()">
    記録を見る
  </button>


  <!-- メニュー表 -->

  <div id="menuList">

    <h2>メニュー表</h2>

    <h3>筋トレ</h3>

    <div id="strengthMenus"></div>

    <h3>ストレッチ</h3>

    <div id="stretchMenus"></div>

    <button class="new-menu-button" onclick="showNewMenuForm()">
      ＋ 新しいメニューを作る
    </button>

  </div>


  <!-- 新しいメニューを作る -->

  <div id="newMenuForm">

    <h2>新しいメニュー</h2>

    <label>メニュー名</label>
    <input
      type="text"
      id="newMenuName"
      placeholder="例：腹筋"
    >

    <label>回数・時間</label>
    <input
      type="text"
      id="newMenuDetail"
      placeholder="例：10回、3分など"
    >

    <label>種類</label>
    <select id="newMenuType">
      <option value="筋トレ">筋トレ</option>
      <option value="ストレッチ">ストレッチ</option>
    </select>

    <button onclick="createMenu()">
      メニュー表に追加
    </button>

  </div>


  <!-- 履歴 -->

  <div id="history">

    <h2>これまでの記録</h2>

    <div id="historyList"></div>

  </div>

</main>


<script>

const todayDate = document.getElementById("todayDate");

const today = new Date();

const dateText =
  today.getFullYear() + "年" +
  (today.getMonth() + 1) + "月" +
  today.getDate() + "日";

todayDate.textContent = dateText;


let selectedMenu = null;


/* 最初から入っているメニュー */

const defaultMenus = [
  {
    name: "腕立て",
    detail: "5回",
    type: "筋トレ"
  },
  {
    name: "ラットプル",
    detail: "30回",
    type: "筋トレ"
  },
  {
    name: "スクワット",
    detail: "10回",
    type: "筋トレ"
  },
  {
    name: "首・肩ストレッチ",
    detail: "3分",
    type: "ストレッチ"
  },
  {
    name: "股関節ストレッチ",
    detail: "3分",
    type: "ストレッチ"
  }
];


/* 自分で追加したメニューを取得 */

function getCustomMenus() {

  return JSON.parse(
    localStorage.getItem("customMenus")
  ) || [];

}


/* メニュー表を表示 */

function showMenu() {

  document.getElementById("menuList").style.display = "block";

  document.getElementById("newMenuForm").style.display = "none";

  displayMenus();
}


/* メニュー表を表示する */

  function displayMenus() {

  const strength =
    document.getElementById("strengthMenus");

  const stretch =
    document.getElementById("stretchMenus");

  strength.innerHTML = "";
  stretch.innerHTML = "";

  const customMenus = getCustomMenus();

  const menus =
    defaultMenus.concat(customMenus);


  menus.forEach(function(menu, index) {

    const card = document.createElement("div");

    card.className = "menu-card";

    card.innerHTML = `
      <div class="menu-name">${menu.name}</div>
      <div class="menu-detail">${menu.detail}</div>

      <button class="use-button">
        今日に追加
      </button>
    `;


    card.querySelector(".use-button").onclick =
      function() {
        addMenu(menu.name, menu.detail);
      };


    /*
      自分で追加したメニューだけ
      編集・削除ボタンを表示
    */

    if (index >= defaultMenus.length) {

      const customIndex =
        index - defaultMenus.length;


      const editButton =
        document.createElement("button");

      editButton.textContent = "編集";

      editButton.onclick =
        function() {
          editMenu(customIndex);
        };


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent = "削除";

      deleteButton.style.background = "#aaa";

      deleteButton.onclick =
        function() {
          deleteMenu(customIndex);
        };


      card.appendChild(editButton);

      card.appendChild(deleteButton);

    }


    if (menu.type === "筋トレ") {

      strength.appendChild(card);

    } else {

      stretch.appendChild(card);

    }

  });

  }


/* 今日のメニューに追加 */

function addMenu(name, detail) {

  selectedMenu = {
    name: name,
    detail: detail
  };

  const todayMenu =
    document.getElementById("todayMenu");

  todayMenu.innerHTML = `
    <div class="menu-card">
      <div class="menu-name">${name}</div>
      <div class="menu-detail">${detail}</div>
    </div>
  `;

  document.getElementById("menuList").style.display =
    "none";
}


/* 保存 */

function saveTraining() {

  if (!selectedMenu) {

    alert("まずメニューを選んでください");

    return;
  }


  const history =
    JSON.parse(
      localStorage.getItem("trainingHistory")
    ) || [];


  const record = {

    date: dateText,

    name: selectedMenu.name,

    detail: selectedMenu.detail

  };


  history.push(record);


  localStorage.setItem(
    "trainingHistory",
    JSON.stringify(history)
  );


  alert("保存しました");


  selectedMenu = null;


  document.getElementById("todayMenu").innerHTML = `
    <div class="empty">
      保存しました
    </div>
  `;

}


/* 新しいメニューの入力画面 */

function showNewMenuForm() {

  document.getElementById("newMenuForm").style.display =
    "block";

}


/* 新しいメニューを作る */

function createMenu() {

  const name =
    document.getElementById("newMenuName").value.trim();

  const detail =
    document.getElementById("newMenuDetail").value.trim();

  const type =
    document.getElementById("newMenuType").value;


  if (!name || !detail) {

    alert("メニュー名と回数・時間を入力してください");

    return;
  }


  const customMenus =
    getCustomMenus();


  customMenus.push({

    name: name,

    detail: detail,

    type: type

  });


  localStorage.setItem(
    "customMenus",
    JSON.stringify(customMenus)
  );


  alert("メニュー表に追加しました");


  document.getElementById("newMenuName").value = "";

  document.getElementById("newMenuDetail").value = "";


  document.getElementById("newMenuForm").style.display =
    "none";


  displayMenus();

}


/* 履歴を見る */

function showHistory() {

  const history =
    JSON.parse(
      localStorage.getItem("trainingHistory")
    ) || [];


  const historyList =
    document.getElementById("historyList");


  document.getElementById("history").style.display =
    "block";


  if (history.length === 0) {

    historyList.innerHTML = `
      <div class="empty">
        まだ記録がありません
      </div>
    `;

    return;

  }


  historyList.innerHTML = "";


  history.slice().reverse().forEach(
    function(record) {

      const item =
        document.createElement("div");

      item.className = "menu-card";

      item.innerHTML = `
        <div class="menu-name">
          ${record.name}
        </div>

        <div class="menu-detail">
          ${record.detail} ・ ${record.date}
        </div>
      `;

      historyList.appendChild(item);

    }
  );

}
function editMenu(index) {

  const customMenus = getCustomMenus();

  const menu = customMenus[index];


  const newName =
    prompt("メニュー名", menu.name);

  if (newName === null) {
    return;
  }


  const newDetail =
    prompt("回数・時間", menu.detail);

  if (newDetail === null) {
    return;
  }


  const newType =
    prompt(
      "種類を入力してください（筋トレ / ストレッチ）",
      menu.type
    );


  if (
    newType !== "筋トレ" &&
    newType !== "ストレッチ"
  ) {

    alert("「筋トレ」または「ストレッチ」と入力してください");

    return;
  }


  customMenus[index] = {

    name: newName,

    detail: newDetail,

    type: newType

  };


  localStorage.setItem(
    "customMenus",
    JSON.stringify(customMenus)
  );


  displayMenus();

  alert("編集しました");

}


function deleteMenu(index) {

  const customMenus = getCustomMenus();


  const menu = customMenus[index];


  const answer =
    confirm(
      "「" + menu.name + "」を削除しますか？"
    );


  if (!answer) {
    return;
  }


  customMenus.splice(index, 1);


  localStorage.setItem(
    "customMenus",
    JSON.stringify(customMenus)
  );


  displayMenus();

  alert("削除しました");

}
</script>

</body>
</html>
