</head>

<body>

<header>

  <div class="header-inner">

    <h1>今日のワークアウト</h1>

    <button
      class="reset-button"
      onclick="resetTraining()"
    >
      リセット
    </button>

  </div>

</header>

<main>

  <div class="date-navigation">

    <button onclick="changeDate(-1)">
      ←
    </button>

    <div class="date-display">

      <span id="dateDisplay"></span>

      <span
        class="today-label"
        id="todayLabel"
      ></span>

    </div>

    <button
      id="nextButton"
      onclick="changeDate(1)"
    >
      →
    </button>

  </div>

  <div class="week-title">
    過去7日間
  </div>

  <div
    class="week"
    id="week"
  ></div>

  <div id="menuList">

    <h2>メニュー表</h2>

    <h3>筋トレ</h3>

    <div
      id="strengthMenus"
      class="menu-grid"
    ></div>

    <h3>ストレッチ</h3>

    <div
      id="stretchMenus"
      class="menu-grid"
    ></div>

    <button
      class="new-menu-button"
      onclick="showNewMenuForm()"
    >
      ＋ 新しいメニューを作る
    </button>

  </div>

  <div id="newMenuForm">

    <h2>新しいメニュー</h2>

    <label>
      メニュー名
    </label>

    <input
      type="text"
      id="newMenuName"
      placeholder="例：腹筋"
    >

    <label>
      回数・時間
    </label>

    <input
      type="text"
      id="newMenuDetail"
      placeholder="例：10回、3分など"
    >

    <label>
      種類
    </label>

    <select id="newMenuType">

      <option value="筋トレ">
        筋トレ
      </option>

      <option value="ストレッチ">
        ストレッチ
      </option>

    </select>

    <button
      class="create-button"
      onclick="createMenu()"
    >
      メニュー表に追加
    </button>

  </div>

</main>

<script>

const defaultMenus = [

  {
    name: "腕立て",
    detail: "5回",
    type: "筋トレ"
  },

  {
    name: "ラットプル",
    detail: "30回",
    type: "筋トレ"
  },

  {
    name: "スクワット",
    detail: "10回",
    type: "筋トレ"
  },

  {
    name: "首・肩ストレッチ",
    detail: "3分",
    type: "ストレッチ"
  },

  {
    name: "股関節ストレッチ",
    detail: "3分",
    type: "ストレッチ"
  }

];

function getToday() {

  const date =
    new Date();

  date.setHours(
    0,
    0,
    0,
    0
  );

  return date;

}

let currentDate =
  getToday();

function getDateKey(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}

function getDateText(date) {

  return (
    date.getFullYear() +
    "年" +
    (date.getMonth() + 1) +
    "月" +
    date.getDate() +
    "日"
  );

}

function isToday(date) {

  return (
    getDateKey(date) ===
    getDateKey(getToday())
  );

}

function getHistory() {

  return JSON.parse(
    localStorage.getItem(
      "trainingHistory"
    )
  ) || [];

}

function getCustomMenus() {

  return JSON.parse(
    localStorage.getItem(
      "customMenus"
    )
  ) || [];

}

function displayDate() {

  document
    .getElementById("dateDisplay")
    .textContent =
    getDateText(currentDate);

  document
    .getElementById("todayLabel")
    .textContent =
    isToday(currentDate)
      ? "今日"
      : "";

  const nextButton =
    document.getElementById(
      "nextButton"
    );

  nextButton.disabled =
    isToday(currentDate);

  nextButton.style.opacity =
    isToday(currentDate)
      ? "0.35"
      : "1";

  displayMenus();

}

function changeDate(amount) {

  const newDate =
    new Date(currentDate);

  newDate.setDate(
    newDate.getDate() + amount
  );

  if (
    newDate > getToday()
  ) {

    return;

  }

  currentDate =
    newDate;

  displayDate();

  displayWeek();

}

function displayMenus() {

  const strength =
    document.getElementById(
      "strengthMenus"
    );

  const stretch =
    document.getElementById(
      "stretchMenus"
    );

  strength.innerHTML = "";

  stretch.innerHTML = "";

  const customMenus =
    getCustomMenus();

  const menus =
    defaultMenus.concat(
      customMenus
    );

  const history =
    getHistory();

  const dateKey =
    getDateKey(currentDate);

  menus.forEach(
    function(menu, index) {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "menu-card";

      const isDone =
        history.some(
          function(record) {

            return (
              record.dateKey ===
                dateKey &&
              record.name ===
                menu.name &&
              record.detail ===
                menu.detail
            );

          }
        );

      if (isDone) {

        card.classList.add(
          "done"
        );

      }

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "menu-name";

      name.textContent =
        menu.name;

      const detail =
        document.createElement(
          "div"
        );

      detail.className =
        "menu-detail";

      detail.textContent =
        menu.detail;

      card.appendChild(name);

      card.appendChild(detail);

      card.onclick =
        function() {

          toggleMenu(
            menu.name,
            menu.detail
          );

        };

      if (
        index >=
        defaultMenus.length
      ) {

        const customIndex =
          index -
          defaultMenus.length;

        const editDelete =
          document.createElement(
            "div"
          );

        editDelete.className =
          "edit-delete";

        const editButton =
          document.createElement(
            "button"
          );

        editButton.className =
          "edit-button";

        editButton.textContent =
          "編集";

        editButton.onclick =
          function(event) {

            event.stopPropagation();

            editMenu(
              customIndex
            );

          };

        const deleteButton =
          document.createElement(
            "button"
          );

        deleteButton.className =
          "delete-button";

        deleteButton.textContent =
          "削除";

        deleteButton.onclick =
          function(event) {

            event.stopPropagation();

            deleteMenu(
              customIndex
            );

          };

        editDelete.appendChild(
          editButton
        );

        editDelete.appendChild(
          deleteButton
        );

        card.appendChild(
          editDelete
        );

      }

      if (
        menu.type ===
        "筋トレ"
      ) {

        strength.appendChild(
          card
        );

      } else {

        stretch.appendChild(
          card
        );

      }

    }
  );

}

function toggleMenu(
  name,
  detail
) {

  const history =
    getHistory();

  const dateKey =
    getDateKey(currentDate);

  const index =
    history.findIndex(
      function(record) {

        return (
          record.dateKey ===
            dateKey &&
          record.name ===
            name &&
          record.detail ===
            detail
        );

      }
    );

  if (index !== -1) {

    history.splice(
      index,
      1
    );

  }

  else {

    history.push({

      date:
        getDateText(
          currentDate
        ),

      dateKey:
        dateKey,

      name:
        name,

      detail:
        detail

    });

  }

  localStorage.setItem(
    "trainingHistory",
    JSON.stringify(
      history
    )
  );

  displayMenus();

  displayWeek();

}

function resetTraining() {

  const dateKey =
    getDateKey(
      currentDate
    );

  const history =
    getHistory();

  const hasRecord =
    history.some(
      function(record) {

        return (
          record.dateKey ===
          dateKey
        );

      }
    );

  if (!hasRecord) {

    return;

  }

  const answer =
    confirm(
      getDateText(
        currentDate
      ) +
      "のトレーニングをリセットしますか？"
    );

  if (!answer) {

    return;

  }

  const newHistory =
    history.filter(
      function(record) {

        return (
          record.dateKey !==
          dateKey
        );

      }
    );

  localStorage.setItem(
    "trainingHistory",
    JSON.stringify(
      newHistory
    )
  );

  displayMenus();

  displayWeek();

}

function showNewMenuForm() {

  document
    .getElementById(
      "newMenuForm"
    )
    .style.display =
    "block";

}

function createMenu() {

  const name =
    document
      .getElementById(
        "newMenuName"
      )
      .value
      .trim();

  const detail =
    document
      .getElementById(
        "newMenuDetail"
      )
      .value
      .trim();

  const type =
    document
      .getElementById(
        "newMenuType"
      )
      .value;

  if (
    !name ||
    !detail
  ) {

    alert(
      "メニュー名と回数・時間を入力してください"
    );

    return;

  }

  const customMenus =
    getCustomMenus();

  customMenus.push({

    name:
      name,

    detail:
      detail,

    type:
      type

  });

  localStorage.setItem(
    "customMenus",
    JSON.stringify(
      customMenus
    )
  );

  document
    .getElementById(
      "newMenuName"
    )
    .value = "";

  document
    .getElementById(
      "newMenuDetail"
    )
    .value = "";

  document
    .getElementById(
      "newMenuForm"
    )
    .style.display =
    "none";

  displayMenus();

  alert(
    "メニュー表に追加しました"
  );

}

function editMenu(index) {

  const customMenus =
    getCustomMenus();

  const menu =
    customMenus[index];

  const newName =
    prompt(
      "メニュー名",
      menu.name
    );

  if (
    newName === null
  ) {

    return;

  }

  const newDetail =
    prompt(
      "回数・時間",
      menu.detail
    );

  if (
    newDetail === null
  ) {

    return;

  }

  const newType =
    prompt(
      "種類を入力してください（筋トレ / ストレッチ）",
      menu.type
    );

  if (
    newType !== "筋トレ" &&
    newType !== "ストレッチ"
  ) {

    alert(
      "「筋トレ」または「ストレッチ」と入力してください"
    );

    return;

  }

  customMenus[index] = {

    name:
      newName,

    detail:
      newDetail,

    type:
      newType

  };

  localStorage.setItem(
    "customMenus",
    JSON.stringify(
      customMenus
    )
  );

  displayMenus();

}

function deleteMenu(index) {

  const customMenus =
    getCustomMenus();

  const menu =
    customMenus[index];

  const answer =
    confirm(
      "「" +
      menu.name +
      "」を削除しますか？"
    );

  if (!answer) {

    return;

  }

  customMenus.splice(
    index,
    1
  );

  localStorage.setItem(
    "customMenus",
    JSON.stringify(
      customMenus
    )
  );

  displayMenus();

}

function displayWeek() {

  const week =
    document.getElementById(
      "week"
    );

  week.innerHTML = "";

  const history =
    getHistory();

  for (
    let i = 6;
    i >= 0;
    i--
  ) {

    const date =
      getToday();

    date.setDate(
      date.getDate() - i
    );

    const dateKey =
      getDateKey(date);

    const hasTraining =
      history.some(
        function(record) {

          return (
            record.dateKey ===
            dateKey
          );

        }
      );

    const dayNames = [
      "日",
      "月",
      "火",
      "水",
      "木",
      "金",
      "土"
    ];

    const dayBox =
      document.createElement(
        "div"
      );

    dayBox.className =
      "day";

    dayBox.textContent =
      dayNames[
        date.getDay()
      ];

    const circle =
      document.createElement(
        "div"
      );

    circle.className =
      "circle";

    if (hasTraining) {

      circle.classList.add(
        "done"
      );

    }

    if (isToday(date)) {

      circle.classList.add(
        "today"
      );

    }

    dayBox.appendChild(
      circle
    );

    week.appendChild(
      dayBox
    );

  }

}

displayDate();

displayWeek();

displayMenus();

</script>

</body>
</html>
